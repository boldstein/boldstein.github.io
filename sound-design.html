<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benny Beausoleil — Sound Design</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }

    #benny-sound-design {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      color: #1a1a1a;
      max-width: 900px;
      margin: 80px auto 0 !important;
      padding: 0 40px 100px;
      -webkit-font-smoothing: antialiased;
    }

    .sub-nav {
      display: flex;
      justify-content: flex-start;
      gap: 30px;
      margin-bottom: 40px;
    }
    .sub-nav a, .sub-nav span {
      text-decoration: none;
      color: #86868b;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: color 0.2s ease;
    }
    .sub-nav a:hover { color: #1a1a1a; }
    .sub-nav .active { color: #d1d1d6; cursor: default; }

    .page-header {
      display: flex;
      justify-content: flex-end;
      border-bottom: 1px solid #1a1a1a;
      padding-bottom: 10px;
      margin-bottom: 80px;
    }

    .header-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #1a1a1a;
    }

    .project-item {
      margin-bottom: 80px;
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      background: #f5f5f7;
      border-radius: 2px;
      margin-bottom: 15px;
      filter: grayscale(100%) contrast(1.1);
      opacity: 0.9;
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .project-item:hover .video-container {
      filter: grayscale(0%) contrast(1);
      opacity: 1;
    }

    .video-container iframe {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
    }

    .project-meta {
      display: flex;
      justify-content: flex-end;
      border-top: 1px solid #e5e5e5;
      padding-top: 15px;
    }

    .project-role {
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 11px;
      color: #86868b;
      text-transform: uppercase;
    }

    @media (max-width: 768px) {
      #benny-sound-design { padding: 0 24px 60px; margin-top: 40px !important; }

      .sub-nav {
        gap: 20px;
        overflow-x: auto;
        white-space: nowrap;
        padding-bottom: 15px;
        margin-bottom: 20px;
        margin-right: -24px;
        border-bottom: 1px solid #f2f2f2;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .sub-nav::-webkit-scrollbar { display: none; }
      .sub-nav a, .sub-nav span { font-size: 10px; letter-spacing: 0.15em; }

      .project-item { margin-bottom: 60px; }
      .page-header { margin-bottom: 40px; }
    }
  </style>
</head>
<body>
  <div id="benny-sound-design">
    <nav class="sub-nav">
      <a href="index.html">← Index</a>
      <span class="active">Sound Design</span>
      <a href="engineering.html">Engineering</a>
      <a href="podcasts.html">Podcasts</a>
      <a href="performance.html">Performance</a>
      <a href="mailto:boldstein@gmail.com">Contact</a>
    </nav>

    <div class="page-header">
      <span class="header-title">Sound Design</span>
    </div>

    <div class="project-item">
      <div class="video-container">
        <iframe src="https://www.youtube.com/embed/qSrWDMjvumo?si=nwbKMAyG6HHqAswZ" allowfullscreen></iframe>
      </div>
      <div class="project-meta">
        <span class="project-role">Reel</span>
      </div>
    </div>

    <div class="project-item">
      <div class="video-container">
        <iframe src="https://www.youtube.com/embed/b5GEFfYehYs?rel=0&showinfo=0" allowfullscreen></iframe>
      </div>
      <div class="project-meta">
        <span class="project-role">Exploration</span>
      </div>
    </div>
  </div>
</body>
</html>
